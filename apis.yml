name: Tolmo
description: >-
  Tolmo builds AI-native cybersecurity for engineering teams. Its platform pairs
  automated cloud and SaaS discovery (AWS, GitHub, Datadog, Linear, Cloudflare,
  and more) with event-driven agents that run continuous pentesting, threat
  modeling, finding generation, and verified remediation against the customer's
  real infrastructure graph. The primary developer surface is the Tolmo CLI: SQL
  and Cypher queries over the infrastructure graph, full-lifecycle security
  findings management, and a secure server-side proxy for GitHub/AWS/Linear/
  Sentry/Datadog requests, plus a first-party agent skill for Claude Code and
  other AI agents. Backed by Accel and Y Combinator.
